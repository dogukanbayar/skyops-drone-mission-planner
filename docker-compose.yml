services:
  db:
    image: postgres:16-alpine
    container_name: droneops-db
    environment:
      POSTGRES_DB: droneops
      POSTGRES_USER: droneops
      POSTGRES_PASSWORD: droneops
    ports:
      - "5432:5432"
    volumes:
      - droneops-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U droneops -d droneops"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    container_name: droneops-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/droneops
      DB_USER: droneops
      DB_PASSWORD: droneops
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8080:8080"

volumes:
  droneops-data:
