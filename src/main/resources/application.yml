spring:
  application:
    name: drone-ops
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/droneops}
    username: ${DB_USER:droneops}
    password: ${DB_PASSWORD:droneops}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
droneops:
  seed:
    enabled: true
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs
server:
  port: 8080
